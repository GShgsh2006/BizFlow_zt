services:
  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # 数据库连接（确保密码和下面 mysql 里的完全一致）
      - HOSTNAME=mysql
      - PORT=3306
      - USERNAME=root
      - PASSWORD=12345678
      - DATABASE=fastapi_sjk
      - DATABASE_URL=mysql+pymysql://root:12345678@mysql:3306/fastapi_sjk?charset=utf8mb4
      # 容器里连 rabbitmq 服务；账号见下面的 rabbitmq 服务
      - RABBITMQ_URL=amqp://bizflow:bizflow123@rabbitmq:5672/
      # 🚨 关键：解决 HuggingFace 下载失败
      - HF_ENDPOINT=https://hf-mirror.com
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: bizflow
      RABBITMQ_DEFAULT_PASS: bizflow123
    ports:
      - "5672:5672"    # AMQP（后端连这个）
      - "15672:15672"  # 管理台 http://localhost:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: 12345678  # 🚨 密码必须和上面一模一样
      MYSQL_DATABASE: fastapi_sjk    # 🚨 数据库名也要一致
    ports:
      - "3308:3306"                  # 本地依旧用 3308 连接
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p12345678"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped   # 电脑/Docker 重启后自动拉起，不用手动再启

volumes:
  mysql_data: